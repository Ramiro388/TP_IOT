<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Porton - HTTP Native</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #e0e1dd;
            font-family: system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .panel {
            background: #1b263b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            width: 90%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            font-size: 1.6rem;
            margin-bottom: 5px;
            color: #e0e1dd;
        }
        .sub {
            color: #415a77;
            font-size: 0.9rem;
            margin-bottom: 25px;
        }
        .indicador {
            background: #0d1b2a;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
        }
        .libre { color: #778da9; }
        .activo { color: #ff4d4d; }
        .motor { color: #00b4d8; font-size: 1.2rem; }
        .botones {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-g { background-color: #0077b6; color: white; }
        .btn-p { background-color: #e63946; color: white; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <div class="panel">
        <h1>Portón Automatizado</h1>
        <div class="sub">TP Control de Motor (Amparo Rodríguez)</div>
        
        <div class="indicador">FDC IZQ: <span id="fdcIzq" class="libre">LIBRE</span></div>
        <div class="indicador">FDC DER: <span id="fdcDer" class="libre">LIBRE</span></div>
        <div class="indicador motor">MOTOR: <span id="motorEstado">DETENIDO</span></div>
        
        <div class="botones">
            <button class="btn-g" onclick="cmd(1)">ABRIR</button>
            <button class="btn-p" onclick="cmd(0)">PARAR</button>
            <button class="btn-g" onclick="cmd(2)">CERRAR</button>
        </div>
    </div>

    <script>
        function cmd(n) {
            fetch("/control?cmd=" + n, { method: "POST" });
        }

        setInterval(function() {
            fetch("/estado")
                .then(res => res.json())
                .then(data => {
                    const fI = document.getElementById("fdcIzq");
                    const fD = document.getElementById("fdcDer");
                    const mE = document.getElementById("motorEstado");

                    if (data.fdcI === 1) { fI.textContent = "ACTIVADO"; fI.className = "activo"; }
                    else { fI.textContent = "LIBRE"; fI.className = "libre"; }

                    if (data.fdcD === 1) { fD.textContent = "ACTIVADO"; fD.className = "activo"; }
                    else { fD.textContent = "LIBRE"; fD.className = "libre"; }

                    if (data.motor === 0) mE.textContent = "DETENIDO";
                    else if (data.motor === 1) mE.textContent = "ABRIENDO";
                    else if (data.motor === 2) mE.textContent = "CERRANDO";
                    else if (data.motor === 3) mE.textContent = "BLOQUEADO";
                });
        }, 150);
    </script>
</body>
</html>
