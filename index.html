<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard IoT</title>
    <!-- Librería MQTT Paho para navegadores -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 30px;
        }
        h2 {
            color: #666;
            margin-top: 20px;
            font-weight: normal;
            text-transform: uppercase;
            font-size: 18px;
            letter-spacing: 1px;
        }
        .value {
            font-size: 54px;
            font-weight: bold;
            color: #ff5722;
            margin: 10px 0 40px 0;
        }
        .btn-container {
            display: flex;
            justify-content: space-around;
        }
        button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: lowercase;
            transition: background 0.3s, transform 0.1s;
        }
        button:active {
            transform: scale(0.95);
        }
        .btn-abrir {
            background-color: #4caf50;
            color: white;
        }
        .btn-abrir:hover { background-color: #45a049; }
        .btn-cerrar {
            background-color: #f44336;
            color: white;
        }
        .btn-cerrar:hover { background-color: #da190b; }
        .status {
            font-size: 12px;
            color: #999;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>TP control con IOT (Panza) y (Rentero).</h1>
    <h2>temperatura</h2>
    <div class="value" id="temp-display">-- °C</div>
    
    <div class="btn-container">
        <button class="btn-abrir" onclick="enviarComando('1')">abrir</button>
        <button class="btn-cerrar" onclick="enviarComando('0')">cerrar</button>
    </div>
    
    <div class="status" id="status-text">Conectando al broker...</div>
</div>

<script>
    // Configuración del broker Mosquitto indicado en tu PDF
    const broker = "test.mosquitto.org";
    const port = 8081; // Puerto WebSocket SSL para navegadores
    const clientId = "dashboard_web_" + Math.random().toString(16).substr(2, 8);

    const client = new Paho.MQTT.Client(broker, port, clientId);

    client.onConnectionLost = onConnectionLost;
    client.onMessageArrived = onMessageArrived;

    client.connect({
        onSuccess: onConnect,
        useSSL: true
    });

    function onConnect() {
        document.getElementById("status-text").innerText = "Conectado a test.mosquitto.org";
        document.getElementById("status-text").style.color = "#4caf50";
        // Suscribirse estrictamente al tópico de temperatura de Panza
        client.subscribe("etusiemens/panza/temperatura");
    }

    function onConnectionLost(responseObject) {
        document.getElementById("status-text").innerText = "Conexión perdida. Reintentando...";
        document.getElementById("status-text").style.color = "#f44336";
    }

    // Recibe la temperatura del ESP32 y la actualiza en pantalla
    function onMessageArrived(message) {
        if (message.destinationName === "etusiemens/panza/temperatura") {
            document.getElementById("temp-display").innerText = message.payloadString + " °C";
        }
    }

    // Envía '1' o '0' al tópico del servo de Rentero al presionar los botones
    function enviarComando(valor) {
        if (client.isConnected()) {
            const message = new Paho.MQTT.Message(valor);
            message.destinationName = "etusiemens/rentero/servo";
            client.send(message);
        } else {
            alert("No hay conexión con el broker MQTT");
        }
    }
</script>

</body>
</html>
